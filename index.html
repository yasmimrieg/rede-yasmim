<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mural Anônimo</title>
  
  <!-- SDK oficial do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
      --card-bg: #ffffff;
      --primary: #d81b60;
      --primary-hover: #c2185b;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --border-radius: 16px;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 24px rgba(216, 27, 96, 0.12);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }

    body { 
      background: var(--bg-gradient); 
      min-height: 100vh;
      padding: 40px 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      color: var(--text-main);
    }

    h1 { 
      margin-bottom: 24px; 
      color: #880e4f; 
      font-weight: 800;
      font-size: 2rem;
      letter-spacing: -0.5px;
    }
    
    /* Container para os botões do topo */
    .acoes-topo {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-acao {
      border: none;
      padding: 12px 22px;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: var(--primary);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-acao:hover { 
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .btn-acao:active { transform: translateY(0); }

    /* Containers dinâmicos */
    #form-container, #search-container {
      width: 100%;
      max-width: 460px;
      margin-bottom: 24px;
    }

    /* Estilo genérico dos cards de formulários */
    .form-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-md);
    }

    .form-card input, .form-card textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #f2d6e4;
      background-color: #fff5f8;
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-card input:focus, .form-card textarea:focus {
      border-color: var(--primary);
      background-color: #fff;
    }

    .form-card textarea { resize: vertical; min-height: 80px; }

    .form-acoes {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-cancelar {
      background: #f1f5f9;
      color: var(--text-muted);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-cancelar:hover { background: #e2e8f0; }

    .btn-enviar {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-enviar:hover { background: var(--primary-hover); }

    /* Feedback do Filtro Ativo */
    .filtro-ativo {
      background: white;
      border-radius: 30px;
      padding: 10px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 460px;
      font-weight: 600;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .btn-limpar-filtro {
      background: transparent;
      border: none;
      color: #e91e63;
      font-weight: 700;
      cursor: pointer;
      margin-left: 10px;
    }

    #feed { 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
      width: 100%; 
      max-width: 460px; 
    }

    /* Card da Postagem */
    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease;
    }

    .emoji-box { 
      font-size: 2.2rem; 
      text-align: center;
      line-height: 1;
    }

    .texto-box { 
      font-size: 1.05rem; 
      color: var(--text-main); 
      line-height: 1.5;
      word-break: break-word;
    }

    .hashtags-box { 
      color: #d81b60; 
      font-size: 0.85rem; 
      font-weight: 600; 
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .likes-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-top: 1px solid #fce4ec;
      border-bottom: 1px solid #fce4ec;
      padding: 10px 0;
    }

    .btn-like {
      background: #fce4ec;
      color: var(--primary);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    
    .btn-like:hover:not(:disabled) {
      background: var(--primary);
      color: white;
    }

    .btn-like:active:not(:disabled) { transform: scale(0.95); }
    
    /* Estado desabilitado (curtido) */
    .btn-like:disabled {
      background: #f8bbd0;
      color: #880e4f;
      cursor: default;
      opacity: 0.8;
    }

    .comentarios-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comentarios-titulo {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lista-comentarios {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lista-comentarios li {
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      color: #475569;
      word-break: break-word;
    }

    .form-comentario { display: flex; gap: 8px; margin-top: 4px; }
    
    .form-comentario input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }
    
    .form-comentario input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .form-comentario button {
      padding: 8px 16px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .form-comentario button:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <h1>Mural Anônimo ✉</h1>
  
  <div class="acoes-topo">
    <button class="btn-acao" onclick="toggleFormulario()">+ Nova Postagem</button>
    <button class="btn-acao" onclick="togglePesquisa()">🔍 Pesquisar</button>
  </div>
  
  <div id="form-container"></div>
  <div id="search-container"></div>
  <div id="filtro-container"></div>

  <div id="feed">Carregando postagens...</div>

  <script>
    const SUPABASE_URL = "https://kfmoxvwekopghyyjvmur.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_dNcZd113a_tdCwFEgnEplQ_qZA1uVFi";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const feedEl = document.getElementById("feed");
    const formContainerEl = document.getElementById("form-container");
    const searchContainerEl = document.getElementById("search-container");
    const filtroContainerEl = document.getElementById("filtro-container");

    let hashtagAtual = null;

    function getCurtidasLocais() {
      const curtidas = localStorage.getItem("curtidas_mural");
      return curtidas ? JSON.parse(curtidas) : [];
    }

    function salvarCurtidaLocal(id) {
      const curtidas = getCurtidasLocais();
      if (!curtidas.includes(id)) {
        curtidas.push(id);
        localStorage.setItem("curtidas_mural", JSON.stringify(curtidas));
      }
    }

    function toggleFormulario() {
      searchContainerEl.innerHTML = "";
      if (formContainerEl.innerHTML !== "") {
        formContainerEl.innerHTML = "";
        return;
      }

      formContainerEl.innerHTML = `
        <form class="form-card" onsubmit="criarPostagem(event)">
          <input type="text" id="input-emoji" placeholder="Emoji (ex: 😍, 🚀, 🤡)" maxlength="50" required />
          <textarea id="input-texto" placeholder="O que você está pensando?" required></textarea>
          <input type="text" id="input-hashtags" placeholder="Hashtags separadas por espaço (ex: #dev #supabase)" />
          
          <div class="form-acoes">
            <button type="button" class="btn-cancelar" onclick="toggleFormulario()">Cancelar</button>
            <button type="submit" class="btn-enviar">Publicar</button>
          </div>
        </form>
      `;
    }

    function togglePesquisa() {
      formContainerEl.innerHTML = "";
      if (searchContainerEl.innerHTML !== "") {
        searchContainerEl.innerHTML = "";
        return;
      }

      searchContainerEl.innerHTML = `
        <form class="form-card" onsubmit="executarPesquisa(event)">
          <input type="text" id="input-busca-hashtag" placeholder="Digite a hashtag (ex: #dev ou dev)" required />
          <div class="form-acoes">
            <button type="button" class="btn-cancelar" onclick="togglePesquisa()">Cancelar</button>
            <button type="submit" class="btn-enviar">Buscar</button>
          </div>
        </form>
      `;
    }

    function executarPesquisa(event) {
      event.preventDefault();
      let term = document.getElementById("input-busca-hashtag").value.trim();
      
      if (!term.startsWith('#')) {
        term = '#' + term;
      }

      hashtagAtual = term;
      searchContainerEl.innerHTML = "";
      carregarPostagens();
    }

    function limparFiltro() {
      hashtagAtual = null;
      filtroContainerEl.innerHTML = "";
      carregarPostagens();
    }

    async function criarPostagem(event) {
      event.preventDefault();

      const emoji = document.getElementById("input-emoji").value.trim();
      const texto = document.getElementById("input-texto").value.trim();
      const hashtagsRaw = document.getElementById("input-hashtags").value.trim();
      
      const hashtags = hashtagsRaw
        ? hashtagsRaw.split(" ")
            .filter(h => h.length > 0)
            .map(h => h.startsWith('#') ? h : '#' + h)
        : [];

      const { error } = await supabaseClient
        .from("postagens")
        .insert([{ emoji, texto, hashtags }]);

      if (error) {
        alert("Erro ao criar postagem!");
        console.error(error);
        return;
      }

      formContainerEl.innerHTML = "";
      carregarPostagens();
    }

    async function carregarPostagens() {
      let query = supabaseClient
        .from("postagens")
        .select("*")
        .order("created_at", { ascending: false });

      if (hashtagAtual) {
        query = query.contains("hashtags", [hashtagAtual]);
        
        filtroContainerEl.innerHTML = `
          <div class="filtro-ativo">
            <span>Filtrando por: ${hashtagAtual}</span>
            <button class="btn-limpar-filtro" onclick="limparFiltro()">Limpar ✖</button>
          </div>
        `;
      } else {
        filtroContainerEl.innerHTML = "";
      }

      const { data: postagens, error } = await query;

      if (error) {
        feedEl.innerHTML = "<p style='text-align:center;'>Erro ao carregar postagens.</p>";
        console.error(error);
        return;
      }

      if (postagens.length === 0) {
        feedEl.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>Nenhuma postagem encontrada.</p>";
        return;
      }

      const curtidasLocais = getCurtidasLocais();

      feedEl.innerHTML = "";
      postagens.forEach(post => {
        const card = document.createElement("div");
        card.className = "card";

        const hashtagsTexto = post.hashtags ? post.hashtags.join(" ") : "";
        const listaComentariosHTML = (post.comentarios || [])
          .map(c => `<li>${c}</li>`)
          .join("");

        const jaCurtido = curtidasLocais.includes(post.id);
        const qtdLikes = post.likes || 0;

        card.innerHTML = `
          ${post.emoji ? `<div class="emoji-box">${post.emoji}</div>` : ''}
          <div class="texto-box">${post.texto}</div>
          ${hashtagsTexto ? `<div class="hashtags-box">${hashtagsTexto}</div>` : ''}
          
          <div class="likes-box">
            <span>❤️ ${qtdLikes} ${qtdLikes === 1 ? 'curtida' : 'curtidas'}</span>
            <button 
              class="btn-like" 
              onclick="curtirPost(${post.id}, ${qtdLikes})"
              ${jaCurtido ? 'disabled' : ''}
            >
              ${jaCurtido ? 'Curtido' : 'Curtir'}
            </button>
          </div>

          <div class="comentarios-box">
            <span class="comentarios-titulo">Comentários</span>
            ${listaComentariosHTML ? `<ul class="lista-comentarios">${listaComentariosHTML}</ul>` : ''}
            <form class="form-comentario" onsubmit="adicionarComentario(event, ${post.id}, ${JSON.stringify(post.comentarios || []).replace(/"/g, '&quot;')})">
              <input type="text" placeholder="Escreva um comentário..." required />
              <button type="submit">Enviar</button>
            </form>
          </div>
        `;

        feedEl.appendChild(card);
      });
    }

    async function curtirPost(id, likesAtuais) {
      const curtidasLocais = getCurtidasLocais();
      if (curtidasLocais.includes(id)) return;

      const { error } = await supabaseClient
        .from("postagens")
        .update({ likes: likesAtuais + 1 })
        .eq("id", id);

      if (!error) {
        salvarCurtidaLocal(id);
        carregarPostagens();
      }
    }

    async function adicionarComentario(event, id, comentariosAtuais) {
      event.preventDefault();
      const input = event.target.querySelector("input");
      const novoComentario = input.value.trim();

      if (!novoComentario) return;

      const { error } = await supabaseClient
        .from("postagens")
        .update({ comentarios: [...comentariosAtuais, novoComentario] })
        .eq("id", id);

      if (!error) carregarPostagens();
    }

    carregarPostagens();
  </script>
</body>
</html>
